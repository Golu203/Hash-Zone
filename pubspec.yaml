name: hashzone
description: "HASH ZONE - Premium Digital Clothing Store Flutter Web PWA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.4

  # State & Routing
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  
  # UI & Styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_spinkit: ^5.2.1
  
  # Utilities
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  http: ^1.3.0
  share_plus: ^10.1.4
  intl: ^0.20.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

